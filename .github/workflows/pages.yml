# 수동 실행(Actions 탭 → Run workflow) 으로 dist 를 GitHub Pages 에 올린다.
# 저장소 설정 → Pages → Source 를 “GitHub Actions” 로 바꿔야 한다. 생년월일시를 다루는 도구이므로
# 공개 여부는 저장소 소유자가 정하도록 자동 배포는 켜 두지 않았다.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
